name: Security — gitleaks + CodeQL

on:
  workflow_call:
    inputs:
      enable-codeql:
        type: boolean
        default: true
      codeql-languages:
        description: 'JSON array of CodeQL languages, e.g. ["python","javascript-typescript"]'
        type: string
        default: '["python","javascript-typescript"]'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "${PWD}:/path" zricethezap/gitleaks:latest detect --source /path --redact

  codeql:
    if: inputs.enable-codeql
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(inputs.codeql-languages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
