name: CI — Android (reusable)

# Reusable Android CI workflow for the Muffy1 org.
# Call from any Android repo:
#
#   jobs:
#     android:
#       uses: Muffy1/infra-automation/.github/workflows/android-build.yml@main
#       with:
#         java-version: "17"
#         build-variant: "Debug"
#         gradle-args: "assembleDebug"
#       secrets:
#         SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}   # optional; base64 of the .jks
#         SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
#         SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
#         SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
#
# Optional caller secrets (all optional; do not commit keystores):
#   SIGNING_KEYSTORE_B64       — base64 of the .jks keystore
#   SIGNING_KEYSTORE_PASSWORD
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD
#
# When SIGNING_KEYSTORE_B64 is set, this workflow decodes it to
# ${{ runner.temp }}/release.keystore and exports SIGNING_KEYSTORE_FILE
# (absolute path) via GITHUB_ENV. Callers should prefer SIGNING_KEYSTORE_FILE
# when set; B64 and password/alias/key password env vars remain available.
# Never invent or commit keystore material.
#
# NOTE: every action is SHA-pinned to a specific commit (no mutable tags),
# per the org's supply-chain policy. Bump intentionally, verify the SHA.

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version (17 for AGP 8.x, 21 for AGP 8.13+/Kotlin 2.2+)"
        type: string
        default: "17"
      working-directory:
        description: "Subdirectory containing settings.gradle(.kts)"
        type: string
        default: "."
      gradle-args:
        description: "Gradle tasks to run (e.g. assembleDebug, testDebugUnitTest)"
        type: string
        default: "assembleDebug"
      build-variant:
        description: "Variant label for artifact naming (Debug|Release)"
        type: string
        default: "Debug"
      artifact-name:
        description: "Artifact name override; default <repo>-<variant>"
        type: string
        default: ""
      enable-cache:
        description: "Enable Gradle build cache + configuration cache"
        type: boolean
        default: true
      timeout-minutes:
        description: "Job timeout"
        type: number
        default: 30
      apk-path:
        description: "Glob of APKs to upload, relative to working-directory"
        type: string
        default: "app/build/outputs/apk/**/*.apk"
      aab-path:
        description: "Glob of AABs to upload, relative to working-directory"
        type: string
        default: "app/build/outputs/bundle/**/*.aab"
      mapping-path:
        description: "Glob of ProGuard/R8 mapping files, relative to working-directory"
        type: string
        default: "app/build/outputs/mapping/**/mapping.txt"
      upload-artifacts:
        description: "Upload APK/AAB and mapping artifacts after a successful build"
        type: boolean
        default: true
      validate-wrapper:
        description: "Validate the Gradle wrapper checksums after checkout"
        type: boolean
        default: true
    secrets:
      SIGNING_KEYSTORE_B64:
        required: false
      SIGNING_KEYSTORE_PASSWORD:
        required: false
      SIGNING_KEY_ALIAS:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false

concurrency:
  group: android-build-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        if: ${{ inputs.validate-wrapper }}
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: ${{ !inputs.enable-cache }}

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        if: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          KEYSTORE_PATH="${{ runner.temp }}/release.keystore"
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          echo "SIGNING_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build (${{ inputs.gradle-args }})
        run: ./gradlew --no-daemon --stacktrace ${{ inputs.gradle-args }}
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload APK/AAB artifacts
        if: ${{ success() && inputs.upload-artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('{0}-{1}', github.event.repository.name, inputs.build-variant) }}
          path: |
            ${{ inputs.working-directory }}/${{ inputs.apk-path }}
            ${{ inputs.working-directory }}/${{ inputs.aab-path }}
            ${{ inputs.working-directory }}/${{ inputs.mapping-path }}
          if-no-files-found: warn
          retention-days: 14
