name: Auto-label

on:
  workflow_call:

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply path-based labels
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          fail-on-error: false
