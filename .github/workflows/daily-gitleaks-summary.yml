name: Daily gitleaks summary

on:
  schedule:
    # Every day at 06:13 UTC
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Find or create daily-summary issue
        id: find-issue
        uses: peter-evans/find-or-create-issue@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Daily security scan — ${{ github.event.repository.name }}"
          body: |
            Auto-generated by `daily-gitleaks-summary.yml`. Updated on each run.
            See workflow logs for the full scan output.
          labels: security, automated, gitleaks

      - name: Update summary issue
        if: steps.find-issue.outputs.issue-number
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.find-issue.outputs.issue-number }}
          body: |
            ## Daily gitleaks scan — ${{ github.run_id }}

            - **Date:** ${{ github.event.head_commit.timestamp || 'manual' }}
            - **Commit:** ${{ github.sha }}
            - **Findings:** see [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            > One issue per repo, updated daily. Close it manually if you want to silence the schedule.
        edit-mode: replace
